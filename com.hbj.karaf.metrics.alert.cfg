# ===================================================
# Configuration des alertes - Karaf Metrics Dashboard
# ===================================================

# Activation générale des alertes (true/false)
enabled=true

# Seuils en pourcentage
cpu.threshold=75
memory.threshold=80
disk.threshold=95

# Chemin du fichier de rapport (relatif à karaf.data ou absolu)
report.file=metrics-alerts.log

# Niveau de détail des rapports : "compact" (recommandé) ou "full"
report.detail=compact

# --- Configuration de l'envoi d'emails ---
#========================================================
# installation du package pour l'envoi de MAIL avec SMTP 
#	I - javax.mail-1.6.2.jar
# 		1 - telecharger le fichier .jar à partir de ce lien https://repo1.maven.org/maven2/com/sun/mail/javax.mail/1.6.2/javax.mail-1.6.2.jar
# 		2 - placer le dans un répertoir /tmp/javax.mail-1.6.2.jar
# 		3 - installer le en utilisant cette commande bundle:install -s file:/tmp/javax.mail-1.6.2.jar
#	II - javax.activation-1.2.0.jar
# 		1 - telecharger le fichier .jar à partir de ce lien https://repo1.maven.org/maven2/com/sun/activation/javax.activation/1.2.0/javax.activation-1.2.0.jar
# 		2 - placer le dans un répertoir /tmp/javax.activation-1.2.0.jar
# 		3 - installer le en utilisant cette commande bundle:install -s file:/tmp/javax.activation-1.2.0.jar
# sinon tu peux utiliser les API MAIL comme MailJet sans aucune dépendance 
#========================================================

# Activation de l'envoi d'e-mails (via API Mailjet)
mail.enabled=false

# Clé API Mailjet (mail.username) et clé secrète (mail.password)
mail.username=VOTRE_CLE_API
mail.password=VOTRE_CLE_SECRETE

# Expéditeur (adresse vérifiée dans Mailjet)
mail.from=alertes@votredomaine.com
mail.from.name=Karaf Metrics

# Destinataire
mail.to=admin@example.com
mail.to.name=Admin

# Sujet de l'e-mail
mail.subject=Karaf Metrics Alert

# Délai minimum entre deux envois (en minutes, 0 = pas de répétition)
mail.cooldown.minutes=30

# Envoyer un e-mail de résolution quand l'alerte disparaît
mail.send.resolution=true
